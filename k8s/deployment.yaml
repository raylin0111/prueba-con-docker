apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskapi
  template:
    metadata:
      labels:
        app: taskapi
    spec:
      containers:
        - name: taskapi
          image: raylin11/taskapi:latest
          ports:
            - containerPort: 5000
